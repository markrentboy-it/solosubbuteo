    <style>
        /* RESET & VARIABILI */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --primary: #065f46;
            --primary-dark: #022c22;
            --accent: #059669;
            --accent-light: #ecfdf5;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --bg-light: #f3f4f6;
            --card-bg: #ffffff;
            --transition: all 0.3s ease;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* HEADER & MENU */
        header {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            gap: 15px;
        }
        @media (min-width: 768px) {
            .header-container {
                flex-direction: row;
                padding: 20px;
            }
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
            transition: var(--transition);
        }
        .logo:hover {
            opacity: 0.9;
        }
        .logo i {
            background-color: #ffffff;
            color: var(--primary);
            padding: 8px 10px;
            border-radius: 50%;
            font-size: 1.2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo span {
            font-size: 1.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            position: relative;
            padding-bottom: 4px;
            transition: var(--transition);
        }
        nav a:hover {
            color: #6ee7b7;
        }
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #6ee7b7;
            transition: var(--transition);
        }
        nav a:hover::after {
            width: 100%;
        }

        /* HERO COPERTINA */
        .hero {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #ffffff;
            text-align: center;
            padding: 80px 20px;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 10%, transparent 10.5%);
            background-size: 20px 20px;
            opacity: 0.3;
        }
        .hero h1 {
            font-size: 2.6rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        @media (min-width: 768px) {
            .hero h1 { font-size: 3.5rem; }
        }
        .hero p {
            font-size: 1.15rem;
            color: #d1fae5;
            max-width: 750px;
            margin: 0 auto 35px auto;
            font-style: italic;
            font-weight: 300;
        }
        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            position: relative;
            z-index: 10;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            transition: var(--transition);
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .btn-white {
            background-color: #ffffff;
            color: var(--primary-dark);
        }
        .btn-white:hover {
            background-color: #e5e7eb;
            transform: translateY(-2px);
        }
        .btn-green {
            background-color: var(--accent);
            color: #ffffff;
            border: 1px solid #10b981;
        }
        .btn-green:hover {
            background-color: #047857;
            transform: translateY(-2px);
        }

        .adsbygoogle-container {
            margin: 35px auto;
            max-width: 970px;
            padding: 10px;
            background-color: #e5e7eb;
            border: 1px dashed #b91c1c; /* Bordo rosso tenue per ricordarti dove sono */
            border-radius: 6px;
            text-align: center;
        }
        .adsbygoogle-container::before {
            content: "POSIZIONAMENTO ADSENSE";
            display: block;
            font-size: 0.65rem;
            color: #b91c1c;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .ads-placeholder {
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* GRIGLIA SEZIONI PRINCIPALI */
        main {
            flex-grow: 1;
            padding-bottom: 50px;
        }
        .grid {
            display: grid;
            grid-template-cols: 1fr;
            gap: 35px;
        }
        @media (min-width: 768px) {
            .grid {
                grid-template-cols: 1fr 1fr;
            }
        }

        /* LE SCHEDE (CARDS) */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 5px solid var(--accent);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            transition: var(--transition);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .card-body {
            padding: 30px;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--primary);
            font-size: 1.45rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 18px;
            letter-spacing: -0.01em;
        }
        .card-title i {
            font-size: 1.6rem;
        }
        .card p {
            color: #4b5563;
            margin-bottom: 20px;
            font-size: 0.98rem;
        }
        
        /* Liste interne alle card */
        .card ul {
            list-style: none;
        }
        .card ul li {
            margin-bottom: 10px;
            color: #374151;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
        }
        .card ul li i {
            color: var(--accent);
            margin-right: 10px;
            font-size: 0.8rem;
        }

        /* Elementi speciali interni */
        .quote-box {
            background-color: var(--accent-light);
            border-left: 4px solid var(--accent);
            padding: 12px 15px;
            font-size: 0.9rem;
            font-style: italic;
            color: #374151;
            border-radius: 0 6px 6px 0;
        }
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background-color: var(--bg-light);
            color: #4b5563;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }
        .card-status {
